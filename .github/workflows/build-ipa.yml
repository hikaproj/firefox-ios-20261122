name: Build GodMode IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build Configuration"
        required: true
        default: "Fennec_Enterprise"
        type: choice
        options:
          - Fennec_Enterprise
          - Debug
          - Firefox
          - Release
      create_release:
        description: "Publish to GitHub Releases"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package GodMode IPA
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Select Xcode & Setup Toolchain
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting latest Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

          # Trust and enable Swift Macros in non-interactive CI environments
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      - name: Ensure Swift Tools Version Compatibility
        run: |
          SWIFT_VER=$(swift --version | head -n 1 | sed -E 's/.*version ([0-9]+\.[0-9]+).*/\1/')
          echo "Runner Swift toolchain version: $SWIFT_VER"
          # Ensure local package manifests do not request tools versions higher than runner's Swift version
          for pkg in BrowserKit/Package.swift MozillaRustComponents/Package.swift Package.swift; do
            if [ -f "$pkg" ]; then
              sed -i '' -E "s/\/\/ swift-tools-version:[ ]*6\.[1-9]/\/\/ swift-tools-version: 6.0/" "$pkg" || true
            fi
          done

      - name: Install dependencies & Build UserScripts
        run: |
          npm ci || npm install
          npm run build

      - name: Run Firefox Bootstrap
        run: |
          ./bootstrap.sh firefox --force

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project firefox-ios/Client.xcodeproj \
            -scheme Fennec \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Build & Archive Client (Fennec)
        env:
          CONFIG: ${{ inputs.configuration || 'Fennec_Enterprise' }}
        run: |
          mkdir -p build
          BUILD_CONFIG="$CONFIG"
          if [ "$BUILD_CONFIG" = "Release" ]; then
            BUILD_CONFIG="Fennec_Enterprise"
          fi
          echo "Selected archive configuration: $BUILD_CONFIG"
          xcodebuild archive \
            -project firefox-ios/Client.xcodeproj \
            -scheme Fennec \
            -configuration "$BUILD_CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath build/Fennec.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Fennec.xcarchive/Products/Applications/Client.app build/Payload/
          cd build
          codesign --force --deep --sign - Payload/Client.app 2>/dev/null || true
          zip -r9 Firefox-GodMode-Omega.ipa Payload
          shasum -a 256 Firefox-GodMode-Omega.ipa > Firefox-GodMode-Omega.ipa.sha256
          ls -lh Firefox-GodMode-Omega.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-GodMode-Omega-IPA
          path: |
            build/Firefox-GodMode-Omega.ipa
            build/Firefox-GodMode-Omega.ipa.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          name: "Firefox GodMode / Omega Zero-Footprint Edition (${{ github.ref_name }})"
          body: |
            # Firefox-iOS GodMode / Omega Zero-Footprint Edition

            **Customized by Hikaproj**  
            - Twitter / X: [@hikaproj](https://x.com/hikaproj)  
            - Website: [https://hikaproj.com](https://hikaproj.com)  
            - Contact: [https://hikaproj.com/new/contact](https://hikaproj.com/new/contact)

            ### Highlights
            - 🚀 **Extreme RAM Reduction:** 2GB〜3GB devices keep background apps (Spotify, Discord, X) alive without Jetsam termination.
            - ⚡ **32 God-Tier Modules:** DevTools, XHR/Fetch/WS Sniffer & Injector, RPA Macro, Local HTTP Server, SQLite FTS5 Knowledge DB, Smart Dark Mode, AI Summarizer, Media Extractor, Floating Dual View.
            - 🛡️ **Sideload Ready:** Compatible with TrollStore, AltStore, SideStore, and LiveContainer.

            ### Downloads
            Download `Firefox-GodMode-Omega.ipa` below and install with TrollStore or AltStore.
          files: |
            build/Firefox-GodMode-Omega.ipa
            build/Firefox-GodMode-Omega.ipa.sha256
